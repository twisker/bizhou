name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: 测试 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # 不在这里指定版本：package.json 的 packageManager 已钉死 pnpm@11.5.2，
      # 两处都写会被 action-setup 直接拒绝（2026-07-25 起 CI 全红的原因）
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint (biome)
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test (bun) —— 不触真实网盘
        run: bun test

      - name: Build（core + 自包含 CLI）
        run: pnpm run build

  # 注：涉及真实百度接口的往返冒烟（M0 验证、QPS 实测）由人工用测试账号执行，
  # 不放入自动 CI（需 OAuth 授权 + 真实配额）。见 .claude/arch-spec-registry.md。
