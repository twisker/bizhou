name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: 测试 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test (bun) —— 不触真实网盘
        run: bun test

  # 注：涉及真实百度接口的往返冒烟（M0 验证、QPS 实测）由人工用测试账号执行，
  # 不放入自动 CI（需 OAuth 授权 + 真实配额）。见 .claude/arch-spec-registry.md。
