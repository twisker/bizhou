title: 敝帚 Bìzhǒu
description: 客户端加密引擎 + 命令行工具（bz）· Client-side encryption CLI for Baidu Netdisk
theme: just-the-docs

# 项目页（https://twisker.github.io/bizhou/）。CI 构建时用 --baseurl 覆盖，无需在此写死。
url: https://twisker.github.io
baseurl: /bizhou

search_enabled: true
heading_anchors: true

aux_links:
  "GitHub ↗":
    - "https://github.com/twisker/bizhou"
aux_links_new_tab: true

footer_content: >-
  Apache-2.0 · 敝帚 Bìzhǒu · 客户端加密，云端只存密文。

# 站内不索引这些
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache

# 所有页面默认套 just-the-docs 的 default 布局（含侧栏导航/搜索/主题骨架）。
# 缺此块时页面只输出裸正文（无 <head>/导航），主题不生效。
defaults:
  - scope:
      path: ""
    values:
      layout: default
